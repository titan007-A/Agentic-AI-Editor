name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        # GitHub's arm64 macOS runners are often out of capacity and would block every
        # merge, so macOS only runs when the workflow is started by hand.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  # The Mac build with its models' packages (MLX Whisper, the separator, MediaPipe, PyTorch
  # on Metal). On demand, like the macOS job above.
  macos-ml:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: brew install ffmpeg-full && echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked --extra ml
      - name: Model packages import
        run: |
          uv run python -c "
          import mlx_whisper, audio_separator, mediapipe, torch
          print('torch', torch.__version__, 'mps', torch.backends.mps.is_available())
          "
      - run: uv run aiedit backends
      - run: uv run pytest -q
      - name: Hardware encoder
        run: |
          ffmpeg -hide_banner -v error -f lavfi -i testsrc2=size=1080x1920:rate=30 -t 2 \
            -c:v h264_videotoolbox -b:v 8M -y /tmp/vt.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height -of csv=p=0 /tmp/vt.mp4

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
