[project]
name = "agentic-editor"
version = "0.1.0"
description = "Local agentic video editor: download, analyze, plan, render and review short-form edits"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "huey>=2.5",
    "itsdangerous>=2.2",
    "numpy>=2.0",
    "pillow>=11.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "shazamio>=0.9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
    "yt-dlp>=2025.10.0",
]

[project.optional-dependencies]
ml = [
    # audio-separator imports audioread but doesn't declare it; librosa used to bring it in.
    "audioread>=3.0",
    "audio-separator[gpu]>=0.39; sys_platform == 'linux'",
    "audio-separator[cpu]>=0.39; sys_platform == 'darwin'",
    "faster-whisper>=1.2",
    "mediapipe>=0.10.20",
    # 1.27+ is built for CUDA 13, while torch cu128 and CTranslate2 load CUDA 12.
    "onnxruntime-gpu>=1.22,<1.27; sys_platform == 'linux'",
    "mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "scenedetect>=0.6.6",
    "torch>=2.8",
    "torchvision>=0.23",
]

[project.scripts]
aiedit = "agentic_editor.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_editor"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: runs the real pipeline on a sample video (needs models, GPU optional)"]
addopts = "-m 'not e2e'"

[tool.uv]
# Packages that install the same module and overwrite each other: mediapipe's
# opencv-contrib-python already provides the cv2 scenedetect asks for, and on Linux
# onnxruntime-gpu already provides the onnxruntime faster-whisper asks for.
override-dependencies = [
    "opencv-python; sys_platform == 'never'",
    "onnxruntime; sys_platform != 'linux'",
]
