name: square-1x1
label: Square post (1:1)
platform: instagram_feed
aspect_ratio: "1:1"
resolution: 1080x1080
fps: 30
min_duration: 15
max_duration: 60
clip_count: 2
captions:
  enabled: true
  font: Anton-Regular
  size: 64
  position: bottom
  margin: 90
  words_per_line: 4
  animation: karaoke
framing:
  mode: center
silence:
  max_pause: 0.7
audio:
  source: original
style_notes: Feed post that plays muted by default, so the captions carry it.
