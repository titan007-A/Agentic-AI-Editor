name: kick-facecam-9x16
label: Kick clips (facecam on top)
platform: instagram_reels
aspect_ratio: '9:16'
resolution: 1080x1920
fps: 30
min_duration: 12.0
max_duration: 45.0
captions:
  enabled: false
hook:
  enabled: false
  overlay: false
  optimize: false
title_overlay:
  enabled: false
one_liner:
  enabled: true
  font: Figtree-SemiBold
  size: 70
  color: '#000000'
  box_color: '#FFFFFF'
  # A clips page's title card: white, across the frame (25 px each side), over the game's top.
  box_margin: 25
  box_radius: 35
  box_pad: 42
  line_spacing: 0.82
  position: top
  offset: 719
  max_words: 14
  hint: >-
    Like a Kick streamer clips page's title card: a curiosity headline about the funny or
    wild moment in this clip, 8 to 14 words in Title Case, with one to three words in
    CAPITALS for the punch (a name only when it is written on screen or said in the clip,
    never a guessed one; else "this streamer", "she", "the chat"), often a question or a
    claim that makes people watch to the end, and end with one or two fitting emoji such as
    😭 😂 👀 💀 🔥 😳. Only what this clip shows. No hashtags, no quotation marks.
  fixed: true
  language: en
# The band between the camera and the game: Kick's logo at its left (rising into the
# camera), the channel at its right.
text_blocks:
- text: KICK.COM/{CHANNEL}
  font: BarlowSemiCondensed-ExtraBold
  size: 36
  min_size: 24
  color: '#FFFFFF'
  anchor: top
  offset: 645
  max_width: 528
  align: left
  inset: 530
images:
- file: assets/kick-logo-band.png
  x: 45
  y: 586
  width: 274
auto_name: false
post_caption:
  enabled: true
  about: video
  language: en
  style: >-
    Like a Kick clips page: start with an emoji, then say what happened on the stream in a
    few punchy lines with the streamer's name, and end with a question for the comments.
  min_words: 40
  max_words: 90
facecam:
  enabled: true
  top: 0
  camera: 621
  gap: 74
  game: 1197
  focus: 0.5
framing:
  mode: face
  background: '#000000'
watermarks:
  blur: true
audio:
  source: original
  loudness_lufs: -14.0
