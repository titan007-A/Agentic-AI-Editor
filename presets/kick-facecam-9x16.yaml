name: kick-facecam-9x16
label: Kick clips (facecam on top)
platform: instagram_reels
aspect_ratio: '9:16'
resolution: 1080x1920
fps: 30
min_duration: 12.0
max_duration: 45.0
captions:
  enabled: false
hook:
  enabled: false
  overlay: false
  optimize: false
title_overlay:
  enabled: false
one_liner:
  enabled: true
  font: Inter-SemiBold
  size: 44
  color: '#000000'
  box_color: '#FFFFFF'
  position: top
  offset: 892
  max_words: 14
  hint: >-
    Like a Kick streamer clips page: say the funny or wild moment in this clip in a few
    words (a name only when it is written on screen or said in the clip, never a guessed
    one; else "this streamer", "she", "the chat"), with one to three words in CAPITALS for
    the punch, and end with one or two fitting emoji such as 😭 😂 👀 💀 🔥. Only what this
    clip shows. No hashtags, no quotation marks.
  fixed: true
  language: en
# The band between the camera and the game: Kick's logo at its left, the channel at its right.
text_blocks:
- text: KICK.COM/{CHANNEL}
  font: Anton-Regular
  size: 66
  min_size: 30
  color: '#FFFFFF'
  anchor: top
  offset: 791
  max_width: 560
  align: right
  inset: 48
images:
- file: assets/kick-logo.png
  x: 44
  y: 770
  width: 380
auto_name: false
post_caption:
  enabled: true
  about: video
  language: en
  style: >-
    Like a Kick clips page: start with an emoji, then say what happened on the stream in a
    few punchy lines with the streamer's name, and end with a question for the comments.
  min_words: 40
  max_words: 90
facecam:
  enabled: true
  top: 0
  camera: 760
  gap: 110
  focus: 0.5
framing:
  mode: face
  background: '#000000'
watermarks:
  blur: true
audio:
  source: original
  loudness_lufs: -14.0
