name: kick-facecam-9x16
label: Kick clips (facecam on top)
platform: instagram_reels
aspect_ratio: '9:16'
resolution: 1080x1920
fps: 30
min_duration: 12.0
max_duration: 45.0
captions:
  enabled: false
hook:
  enabled: false
  overlay: false
  optimize: false
title_overlay:
  enabled: false
one_liner:
  enabled: true
  font: Figtree-SemiBold
  size: 70
  color: '#000000'
  box_color: '#FFFFFF'
  # A clips page's title card: white, across the frame (25 px each side), over the game's top.
  box_margin: 25
  box_radius: 35
  box_pad: 42
  line_spacing: 0.82
  position: top
  offset: 719
  max_words: 14
  hint: >-
    Write it like a real person who runs a Kick clips page, typing it on their phone: what
    actually happens in THIS clip, in your own words, 7 to 13 words in Title Case with one
    to three words in CAPITALS for the punch, ending with one or two fitting emoji (😭 😂 👀
    💀 🔥 😳). Call the streamer by the name the notes give, exactly as written there (if
    they give none, he or she). Nobody else gets a name, even one written on screen or
    heard: say his friend, a girl, this guy, the security guard, the chat. Never "this
    streamer" or "the streamer". Plain everyday words like a fan would use; never chaotic,
    takeover, situation, intense, epic, unleashed, vibes. No swear words and nothing crude:
    say it cleanly. Don't copy what is said word for word; say what happens. A question or
    a claim that makes people watch to the end is good. No hashtags, no quotation marks.
  fixed: true
  language: en
# The band between the camera and the game: Kick's logo at its left (rising into the
# camera), the channel at its right.
text_blocks:
- text: KICK.COM/{CHANNEL}
  font: BarlowSemiCondensed-ExtraBold
  size: 36
  min_size: 24
  color: '#FFFFFF'
  anchor: top
  offset: 645
  max_width: 528
  align: left
  inset: 530
images:
- file: assets/kick-logo-band.png
  x: 45
  y: 586
  width: 274
auto_name: false
post_caption:
  enabled: true
  about: video
  language: en
  style: >-
    Write it like a real person who runs a Kick clips page, not like an article: two to four
    short, casual sentences about what actually happens in this clip, with the streamer's
    name as the notes give it, the way a fan would tell a friend about it, then one short
    question for the comments. Plain everyday words, a bit of slang is fine (bro, nah,
    lowkey); no swear words. Never "Interesting fact", "In this clip", "moment", chaotic,
    situation, intense, epic, unleashed. Nobody else gets a name. At most two emoji, no
    hashtags.
  min_words: 20
  max_words: 60
facecam:
  enabled: true
  top: 0
  camera: 621
  gap: 74
  game: 1197
  focus: 0.5
framing:
  mode: face
  background: '#000000'
watermarks:
  blur: true
audio:
  source: original
  loudness_lufs: -14.0
